- name: Require explicit HIVEFORGE_PROFILE
  ansible.builtin.assert:
    that:
      - hiveforge_profile | length > 0
    fail_msg: "HIVEFORGE_PROFILE must be set explicitly for HiveWatch POC."

- name: Require supported HiveWatch profile
  ansible.builtin.assert:
    that:
      - hiveforge_profile in ['docker-single', 'docker-single-test', 'docker-swarm']
    fail_msg: "Unsupported HIVEFORGE_PROFILE for HiveWatch POC: {{ hiveforge_profile }}"

- name: Derive HiveWatch runtime profile flags
  ansible.builtin.set_fact:
    hivewatch_swarm_profile: "{{ hiveforge_profile == 'docker-swarm' }}"
    hivewatch_test_profile: "{{ hiveforge_profile == 'docker-single-test' }}"
    hivewatch_postgres_host: "{{ 'tasks.postgres' if hiveforge_profile == 'docker-swarm' else 'postgres' }}"
