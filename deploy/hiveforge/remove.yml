- name: Remove HiveWatch POC stack
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    hivewatch_repo_root: "{{ playbook_dir }}/../.."
    hivewatch_runtime_dir: "{{ hivewatch_repo_root }}/.hiveforge"
    hivewatch_compose_template: "{{ playbook_dir }}/templates/docker-compose.yml.j2"
    hivewatch_compose_file: "{{ hivewatch_runtime_dir }}/docker-compose.yml"
    hivewatch_compose_project: hivewatch-poc
    hivewatch_stack_name: hivewatch-poc
    hivewatch_http_port: "18180"
    hiveforge_profile: "{{ lookup('ansible.builtin.env', 'HIVEFORGE_PROFILE') }}"
    hivewatch_service_image_tag: latest
    hivewatch_dummy_image_tag: latest
  tasks:
    - name: Validate HiveWatch profile
      ansible.builtin.import_tasks: tasks/validate-profile.yml

    - name: Check Docker CLI access
      ansible.builtin.command:
        cmd: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
      changed_when: false

    - name: Check Docker Compose plugin
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false
      when: not hivewatch_swarm_profile

    - name: Render HiveWatch Compose file
      ansible.builtin.import_tasks: tasks/render-compose.yml

    - name: Remove HiveWatch POC stack without deleting volumes
      ansible.builtin.command:
        cmd: docker compose --project-name {{ hivewatch_compose_project }} -f {{ hivewatch_compose_file }} down --remove-orphans
        chdir: "{{ hivewatch_runtime_dir }}"
      when: not hivewatch_swarm_profile

    - name: Remove HiveWatch POC Swarm stack without deleting volumes
      ansible.builtin.command:
        cmd: docker stack rm {{ hivewatch_stack_name }}
        chdir: "{{ hivewatch_runtime_dir }}"
      when: hivewatch_swarm_profile
