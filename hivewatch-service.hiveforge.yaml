kind: component
component:
  name: service
  project: hivewatch
deployment:
  adapter: ansible
  actions:
    deploy:
      playbook: deploy/hiveforge/deploy.yml
    remove:
      playbook: deploy/hiveforge/remove.yml
    purge:
      playbook: deploy/hiveforge/purge.yml
    update:
      playbook: deploy/hiveforge/update.yml
    upgrade:
      playbook: deploy/hiveforge/upgrade.yml
requirements:
  environment:
    - HW_HTTP_PORT
    - HIVEFORGE_PROFILE
    - HIVEWATCH_SERVICE_IMAGE_TAG
    - HIVEWATCH_DUMMY_IMAGE_TAG
