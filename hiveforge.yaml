kind: project
project:
  name: hivewatch
  repository: https://github.com/sepa79/HiveWatch.git
  actions:
    - deploy
    - remove
    - purge
    - update
    - upgrade
  vars:
    imageRepository.project: ghcr.io/sepa79
    extRepository.docker: docker.io
    extRepository.ghcr: ghcr.io
  profiles:
    - id: normal
      runtime: docker-single
      serviceSet: normal
      requires:
        managedRoot:
          required: true
          shared: false
          node: local-docker
    - id: test
      runtime: docker-single
      serviceSet: test
      requires:
        managedRoot:
          required: true
          shared: false
          node: local-docker
    - id: swarm-marax-normal
      runtime: docker-swarm
      serviceSet: normal
      requires:
        managedRoot:
          required: true
          shared: false
          node: Marax
        capabilities:
          - placement
    - id: swarm-proxmox-mgr1-normal
      runtime: docker-swarm
      serviceSet: normal
      requires:
        managedRoot:
          required: true
          shared: false
          node: docker-swarm-mgr-1
        capabilities:
          - placement
components:
  - name: service
    manifest: hivewatch-service.hiveforge.yaml
